son')">Lekcija</button><button onclick="show('cards')">Kartice</button><button onclick="startQuiz()">Kviz (9)</button><button onclick="startPairs()">Spoji parove</button><button onclick="startMemory()">Memori</button><button onclick="full()">Cijeli ekran</button></nav><section id="lesson"></section><section id="cards" class="hide"><div class="card"><div id="cardCount"></div><div id="flash" class="big" onclick="flip()"></div><nav><button onclick="prevCard()">Prethodna</button><button onclick="flip()">Okreni</button><button onclick="nextCard()">Sljedeća</button></nav></div></section><section id="quiz" class="hide"><div class="card"><div id="progress"></div><h2 id="question"></h2><div id="answers"></div><p id="score"></p></div></section><section id="pairs" class="hide"><div class="card"><h2>Spoji pitanje i odgovor</h2><p>Pronađi 6 odgovarajućih parova.</p><div id="pairArea" class="pair"></div><p id="pairStatus"></p><button onclick="startPairs()">Nova postava</button></div></section><section id="memory" class="hide"><div class="card"><h2>Memori</h2><p>Pronađi 6 parova.</p><div id="memoryArea" class="memory"></div><p id="memoryStatus"></p><button onclick="startMemory()">Nova postava</button></div></section></main><footer><a href="https://rekicabdo-bihac.github.io/mektebski-portal/">Digitalni mektebski centar</a></footer><script>

vjerodostojnosti iza dva Sahiha?", "options": ["Sunen Ebu Davuda, Sunen Tirmizija, Sunen Nesaija i Sunen Ibn Madžea.", "12.000 hadisa.", "En-Nahl.", "Muhaddisi."]}, {"q": "Kako se zajednički naziva šest poznatih hadiskih zbirki?", "options": ["El-Kutubus-sitte.", "U posljednjim decenijama 20. i početkom 21. stoljeća.", "Da bi bolje razumjeli vjeru i propise Kur’ana.", "Lanac prenosilaca hadisa do ashaba koji su ga čuli ili pamtili od Poslanika, a.s."]}, {"q": "Koju je poznatu zbirku sastavio imam Malik?", "options": ["Muvetta.", "Sahihul-Buhari.", "Sahihu-Muslim.", "Sunen Tirmizija."]}, {"q": "Kada su hadiske zbirke prevedene na bosanski jezik prema lekciji?", "options": ["U posljednjim decenijama 20. i početkom 21. stoljeća.", "Pamćenjem i usmenim prenošenjem.", "Istinitost i vjerodostojnost prenosilaca i hadisa.", "Sahihul-Buhari i Sahihu-Muslim."]}], quizData=[{"q": "Kako su se hadisi prenosili u početku?", "options": ["Pamćenjem i usmenim prenošenjem.", "Zapisivanjem.", "Osnivanjem biblioteke.", "Pisanjem u velike zbirke."]}, {"q": "Kako se nazivaju učenjaci koji proučavaju i sakupljaju hadise?", "options": ["Muhaddisi.", "Muhafizi.", "Učenjaci.", "Hafizi."]}, {"q": "Šta je sened?", "options": ["Lanac prenosilaca hadisa do ashaba koji su ga čuli ili pamtili od Poslanika, a.s.", "Zbirka hadisy.", "Sve hadiske zbirke zajedno", "Lanac prenosilaca hadisa do tabiina koji su ga čuli od ashaba."]}, {"q": "Šta znači sahih hadis?", "options": ["Vjerodostojan hadis.", "Dobar hadis.", "Slab hadis.", "Nepoznat hadis."]}, {"q": "Šta znači hasen hadis?", "options": ["Dobar hadis.", "Vjerodostojan hadis.", "Slab hadis.", "Izmišljen hadis."]}, {"q": "Šta znači daif hadis?", "options": ["Slab hadis.", "Dobar hadis.", "Vjerodostojan hadis.", "Hadis s više prenosilaca."]}, {"q": "Koje su dvije najpoznatije i najvjerodostojnije hadiske zbirke?", "options": ["Sahihul-Buhari i Sahihu-Muslim.", "Sunen Ebu Davuda i Sunen Tirmizija.", "Muvetta i Sunen Nesaija.", "Sunen Ibn Madžea i Muvetta."]}, {"q": "Kako se zajednički naziva šest poznatih hadiskih zbirki?", "options": ["El-Kutubus-sitte.", "El-Kutubus-seba", "El-Kutubus-sijam", "El-Kutubus-sened"]}, {"q": "Koju je poznatu zbirku sastavio imam Malik?", "options": ["Muvetta.", "Sahihul-Buhari.", "Sahih", "Sunen"]}], sections=[["Poslanik, a.s., i objašnjavanje Kur’ana", "Uzvišeni Allah zadužio je Muhammeda, a.s., da ljudima dostavi i pojasni Kur’an. U suri En-Nahl (64) govori se o objašnjavanju onoga u čemu se ljudi razilaze."], ["Prenošenje i zapisivanje hadisa", "Ashabi su slušali Poslanika, a.s., i prenosili ono što je govorio i radio. Na početku se hadisi nisu zapisivali da se ne pomiješaju s Kur’anom; kasnije je Poslanik, a.s., dopustio njihovo zapisivanje."], ["Muhaddisi i sened", "Nakon Poslanikovog preseljenja pojavili su se i izmišljeni hadisi. Muhaddisi su prikupljali hadise i pažljivo provjeravali prenosioce. Sened je lanac prenosilaca koji vodi do ashaba."], ["Vjerodostojnost hadisa", "Hadisi se prema vjerodostojnosti dijele na sahih (vjerodostojne), hasen (dobre) i daif (slabe). Najplodonosniji period sabiranja započeo je krajem prvog i početkom drugog stoljeća po Hidžri."], ["Najpoznatije hadiske zbirke", "Najpoznatije i najvjerodostojnije zbirke su Sahihul-Buhari i Sahihu-Muslim. Slijede Sunen Ebu Davuda, Tirmizija, Nesaija i Ibn Madžea. Ovih šest zbirki naziva se El-Kutubus-sitte. Poznata je i Muvetta imama Malika."], ["Rad hadiskih učenjaka", "Prema udžbeniku, imam Buhari prikupio je 600.000 hadisa, a u zbirku uvrstio 7.000; imam Muslim prikupio je 300.000, a u zbirku uvrstio 12.000. Hadiske zbirke prevedene su i na bosanski jezik; među prevodiocima su Hasan-ef. Škapur, prof. Mahmut-ef. Karalić i prof. dr. Šefik Kurdić."]];
const $=id=>document.getElementById(id);let card=0,turned=false,qi=0,points=0,lock=false,pick=null,matched=0,memFirst=null,memLock=false,memMatched=0;
function beep(ok){try{let a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.frequency.value=ok?740:240;o.connect(g);g.connect(a.destination);g.gain.value=.06;o.start();o.stop(a.currentTime+.13)}catch(e){}}
function full(){document.documentElement.requestFullscreen?.().catch(()=>{})}
function show(id){for(let s of document.querySelectorAll('main section'))s.classList.toggle('hide',s.id!==id);window.scrollTo(0,0);if(id==='cards')renderCard()}
$('lesson').innerHTML=sections.map(([h,t])=>`<article class="card"><h2>${h}</h2><p>${t}</p></article>`).join('');
function renderCard(){$('cardCount').textContent=`Kartica ${card+1} / ${data.length}`;$('flash').textContent=turned?data[card].options[0]:data[card].q}function flip(){turned=!turned;renderCard()}function nextCard(){card=(card+1)%data.length;turned=false;renderCard()}function prevCard(){card=(card+data.length-1)%data.length;turned=false;renderCard()}
function startQuiz(){qi=0;points=0;show('quiz');renderQuiz()}function renderQuiz(){lock=false;if(qi===quizData.length){$('progress').textContent='Kviz završen';$('question').textContent=`Rezultat: ${points} bodova`;$('answers').innerHTML='<button onclick="startQuiz()">Ponovi kviz</button>';$('score').textContent='';return}let d=quizData[qi];$('progress').textContent=`Pitanje ${qi+1} / ${quizData.length}`;$('question').textContent=d.q;$('score').textContent=`Bodovi: ${points}`;let order=[0,1,2,3].sort(()=>Math.random()-.5);$('answers').innerHTML='';order.forEach(i=>{let b=document.createElement('button');b.className='option';b.textContent=d.options[i];b.onclick=()=>{if(lock)return;lock=true;let ok=i===0;points+=ok?10:-3;beep(ok);b.classList.add(ok?'good':'bad');[...$('answers').children].forEach(x=>x.disabled=true);setTimeout(()=>{qi++;renderQuiz()},850)};$('answers').appendChild(b)})}
function sample(){return [...data.keys()].sort(()=>Math.random()-.5).slice(0,6)}
function startPairs(){show('pairs');matched=0;pick=null;let ids=sample(),items=ids.flatMap(i=>[{i,kind:'q',txt:data[i].q},{i,kind:'a',txt:data[i].options[0]}]).sort(()=>Math.random()-.5);$('pairArea').innerHTML='';$('pairStatus').textContent='Spojeno: 0 / 6';items.forEach(it=>{let b=document.createElement('button');b.className='tile';b.textContent=it.txt;b.onclick=()=>{if(b.classList.contains('done'))return;if(!pick){pick={it,b};b.classList.add('sel');return}if(pick.b===b){b.classList.remove('sel');pick=null;return}if(pick.it.i===it.i&&pick.it.kind!==it.kind){b.classList.add('done');pick.b.classList.remove('sel');pick.b.classList.add('done');matched++;beep(true);$('pairStatus').textContent=`Spojeno: ${matched} / 6${matched===6?' – Bravo!':''}`}else{pick.b.classList.remove('sel');beep(false)}pick=null};$('pairArea').appendChild(b)})}
function startMemory(){show('memory');memFirst=null;memLock=false;memMatched=0;let ids=sample(),items=ids.flatMap(i=>[{i,kind:'q',txt:data[i].q},{i,kind:'a',txt:data[i].options[0]}]).sort(()=>Math.random()-.5);$('memoryArea').innerHTML='';$('memoryStatus').textContent='Parovi: 0 / 6';items.forEach((it,j)=>{let b=document.createElement('button');b.textContent=j+1;b.onclick=()=>{if(memLock||b.classList.contains('done')||b.classList.contains('open'))return;b.classList.add('open');b.textContent=it.txt;if(!memFirst){memFirst={it,b,j};return}let prev=memFirst;memFirst=null;if(prev.it.i===it.i&&prev.it.kind!==it.kind){b.classList.add('done');prev.b.classList.add('done');memMatched++;beep(true);$('memoryStatus').textContent=`Parovi: ${memMatched} / 6${memMatched===6?' – Bravo!':''}`}else{memLock=true;beep(false);setTimeout(()=>{b.classList.remove('open');prev.b.classList.remove('open');b.textContent=j+1;prev.b.textContent=prev.j+1;memLock=false},1100)}};$('memoryArea').appendChild(b)})}
show('lesson');
</script></body></html>
